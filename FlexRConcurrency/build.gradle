plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.irisvision.flexrconcurrency'
    compileSdk 35

    defaultConfig {
        //applicationId "com.irisvision.flexrconcurrency"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Règles R8 transmises aux applications qui consomment cette bibliothèque.
        consumerProguardFiles 'consumer-rules.pro'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {

    // api : ce module est consommé en "api" par le noyau ; ses dépendances doivent
    // donc se propager jusqu'aux applications qui dépendent du noyau.
    api libs.appcompat
    api libs.material

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// Publication Maven (POM, sources, javadoc, signature) : voir gradle/publishing.gradle.
apply from: rootProject.file('gradle/publishing.gradle')
