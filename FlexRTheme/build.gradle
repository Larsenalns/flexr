plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.irisvision.flexrthememodule'
    compileSdk 35

    defaultConfig {
        //applicationId "com.irisvision.flexrthememodule"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Règles R8 transmises aux applications qui consomment cette bibliothèque.
        consumerProguardFiles 'consumer-rules.pro'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests {
            // Les classes Android (Color, Looper...) sont touchées par FlexTheme. Sans ceci, tout
            // appel aux stubs lève une RuntimeException. Avec, Color.parseColor() rend 0 et
            // Looper.getMainLooper() rend null — ce qui permet de tester le MÉCANISME (inscription,
            // notification, anti-réentrance, repli sans thread principal) sans écran ni émulateur.
            returnDefaultValues = true
        }
    }
}

dependencies {

    // api : ce module est consommé en "api" par le noyau ; ses dépendances doivent
    // donc se propager jusqu'aux applications qui dépendent du noyau.
    api libs.appcompat
    api libs.material

    // implementation : FlexThreadMain sert à ramener l'application du thème sur le thread
    // principal. Le type n'apparaît dans AUCUNE signature publique de ce module (l'appelant passe
    // un String), donc "implementation" suffit — il reste présent à l'exécution pour le
    // consommateur. Aucun cycle : FlexRConcurrency ne dépend d'aucun autre module du projet.
    implementation(project(":FlexRConcurrency"))

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// Publication Maven (POM, sources, javadoc, signature) : voir gradle/publishing.gradle.
apply from: rootProject.file('gradle/publishing.gradle')
