plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.irisvision.flexrstarter'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Règles R8 transmises aux applications : les écrans de ce starter sont
        // instanciés par réflexion, ils ne doivent donc pas être renommés.
        consumerProguardFiles 'consumer-rules.pro'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {

    // Le starter dépend du noyau ; l'inverse n'est plus vrai.
    api(project(":FlexRCore"))
    api(project(":FlexRTheme"))
    api(project(":FlexRFX"))
    api(project(":FlexRConcurrency"))

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
