plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.irisvision.flexrmedia'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        consumerProguardFiles 'consumer-rules.pro'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {

    // Le noyau FlexR : FlexVideo étend FlexView et utilise FlexContextInterface.
    api(project(":FlexRCore"))
    api(project(":FlexRTheme"))

    // ExoPlayer n'est tiré QUE par ce module. Un projet qui n'affiche pas de vidéo n'ajoute
    // donc aucun artefact media3 à son APK.
    api libs.media3.ui
    api libs.media3.exoplayer
    api libs.media3.common

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
